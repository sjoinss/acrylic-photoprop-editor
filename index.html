<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포토프랍 PDF 에디터</title>
<meta name="description" content="이미지로 아크릴 포토프랍 인쇄용 PDF(화이트·칼선·레이어)를 만드는 브라우저 에디터">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 2h20a2 2 0 012 2v14a2 2 0 01-2 2h-7v10h-6V20H6a2 2 0 01-2-2V4a2 2 0 012-2z' fill='%23E4EBFF' stroke='%231F4FD8' stroke-width='2'/%3E%3C/svg%3E">
<style>:root{--color-primary:#1F4FD8;--color-primary-strong:#1A41B0;--color-primary-soft:#E4EBFF;--color-on-primary:#fff;
--color-text:#1B1F24;--color-muted:#4B5563;--color-bg:#F1F3F6;--color-surface:#fff;--color-stage:#E3E7EC;
--color-line:#CDD2DA;--color-control:#6B7280;--color-warning:#8A4B00;--color-warning-soft:#FFF1D6;
--color-error:#B3261E;--color-error-soft:#FDE7E5;--color-ok:#14532D;--color-ok-soft:#DDF3E4}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;font:15px/1.5 'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;color:var(--color-text);background:var(--color-bg);color-scheme:light;word-break:keep-all}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:fixed;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.app{height:100dvh;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--color-primary);outline-offset:2px}
.btn{min-height:44px;padding:0 14px;border:1px solid #9AA3AF;border-radius:8px;background:var(--color-surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:#EEF1F5}.btn:active{background:#E1E5EA}
.btn.pri{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary)}.btn.pri:hover{background:var(--color-primary-strong)}
.btn.danger{border-color:var(--color-error);color:var(--color-error)}
.btn[aria-pressed=true]{background:var(--color-primary-soft);border-color:var(--color-primary);font-weight:700}
:disabled{opacity:.5;cursor:not-allowed}
.btn[aria-busy=true]::before{content:'';display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:3s!important;transition:none!important}}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:8px 20px;background:var(--color-surface);border-bottom:1px solid var(--color-line)}
h1{margin:0;font-size:18px;line-height:1.3}
.help{font-size:13px;color:var(--color-muted);margin:0}
.designs{display:flex;gap:4px;flex:1;min-width:200px;overflow-x:auto;padding:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:44px;padding:0 12px;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;font-weight:500;color:var(--color-muted);white-space:nowrap}
.tab:hover{color:var(--color-text)}.tab[aria-selected=true],.tab[aria-current=page]{color:var(--color-text);border-bottom-color:var(--color-primary);font-weight:700}
.tab:focus-visible{outline-offset:-3px}
.body{flex:1;min-height:0;display:flex}
.tools{flex:0 0 92px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;background:var(--color-surface);border-right:1px solid var(--color-line);overflow-y:auto}
.tool{width:76px;min-height:60px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tool:hover{background:#EEF1F5}.tool[aria-pressed=true]{background:var(--color-primary-soft);border-color:var(--color-primary);font-weight:700}
.tools .fld{width:76px;text-align:center;margin-top:8px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.viewbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;background:var(--color-surface);border-bottom:1px solid var(--color-line);padding:0 12px}
.views{display:flex;overflow-x:auto;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;padding:4px 0;list-style:none;font-size:13px}
.legend li{display:flex;align-items:center;gap:6px}.legend span{width:16px;height:16px;border:1px solid var(--color-text)}
.stage{position:relative;flex:1;min-height:0;background:var(--color-stage);overflow:hidden}
.stage>canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.stage>canvas:focus-visible{outline-offset:-3px}
.stage.drop::after{content:'여기에 놓으면 이미지가 추가돼요';position:absolute;inset:12px;border:3px dashed var(--color-primary);border-radius:12px;background:rgba(228,235,255,.9);display:grid;place-items:center;font-weight:700;pointer-events:none}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;pointer-events:none}
.empty>*{pointer-events:auto}.empty h2{margin:0;font-size:18px}
.empty>div{background:var(--color-surface);border:1px solid var(--color-line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;max-width:340px}
.busy{position:absolute;right:12px;top:40px;background:var(--color-text);color:#fff;border-radius:6px;padding:4px 10px;font-size:13px;pointer-events:none}
.v3d{position:absolute;inset:0;display:flex;flex-direction:column}
.scene{flex:1;min-height:0;perspective:1100px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;overflow:hidden}
.scene:focus-visible{outline-offset:-4px}
.slab{position:relative;transform-style:preserve-3d;will-change:transform}
.slab canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.ctl3d{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 12px;background:var(--color-surface);border-top:1px solid var(--color-line);max-height:45%;overflow:auto}
.ctl3d>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:8px;border:3px solid #9AA3AF;cursor:pointer}.swatch[aria-pressed=true]{border-color:var(--color-primary)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:4px 20px;padding:4px 16px;background:var(--color-surface);border-top:1px solid var(--color-line);font-size:13px}
.zoom{display:flex;gap:4px;align-items:center}.zoom output{min-width:48px;text-align:center}
.warnchip{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--color-warning);background:var(--color-warning-soft);border:0;padding:0 12px;min-height:44px;border-radius:6px;cursor:pointer;text-align:left;font-size:13px}
aside{flex:0 0 360px;display:flex;flex-direction:column;background:var(--color-surface);border-left:1px solid var(--color-line);min-height:0}
.ptabs{display:flex;border-bottom:1px solid var(--color-line);flex:none}.ptabs .tab{flex:1;padding:0 4px}
.panel{padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1;min-height:0}
.panel>*{flex:none}
.sec{margin:0;font-size:15px;font-weight:700}h3.sec{font-weight:500}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--color-muted);min-width:0}
.fld b{color:var(--color-text)}
.fld input,.fld select{height:44px;border:1px solid var(--color-control);border-radius:6px;padding:0 10px;background:#fff;color:var(--color-text);width:100%;min-width:0}
.fld input[type=range]{padding:0;border:0;accent-color:var(--color-primary)}
input[type=color]{width:64px!important;height:44px;padding:2px!important;border:1px solid var(--color-control);border-radius:6px;background:#fff;cursor:pointer}
.seg{display:flex;border:1px solid var(--color-control);border-radius:8px;overflow:hidden}
.seg.two{display:grid;grid-template-columns:1fr 1fr}
.seg button{flex:1;min-height:44px;border:0;background:#fff;cursor:pointer;font-size:13px;padding:0 6px}
.seg button[aria-pressed=true]{background:var(--color-primary);color:#fff;font-weight:700}
.seg button:focus-visible{outline-offset:-4px}.seg button[aria-pressed=true]:focus-visible{outline-color:#fff}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px}.chk input{width:20px;height:20px;flex:none;accent-color:var(--color-primary)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.g2 .btn,.g3 .btn{padding:0 6px;white-space:normal}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;gap:4px;align-items:center}.list .btn{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis}
.list label{width:44px;height:44px;display:grid;place-items:center;flex:none}.list input{width:20px;height:20px;accent-color:var(--color-primary)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.warntext{color:var(--color-warning);font-size:13px;margin:0}
dialog{border:0;border-radius:12px;padding:24px;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px);color:inherit;overflow:auto}
dialog::backdrop{background:rgba(20,23,27,.5)}
dialog h2{margin:0;font-size:20px}
.banner{display:flex;gap:8px;padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
.warn{background:var(--color-warning-soft);color:var(--color-warning)}.ok{background:var(--color-ok-soft);color:var(--color-ok)}.err{background:var(--color-error-soft);color:var(--color-error)}
.rep{list-style:none;margin:0;padding:0}.rep li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #E1E5EA}
.rep p{margin:0;font-size:14px}.rep small{display:block;font-size:13px;color:var(--color-muted)}.rep .btn{margin-top:8px}
.tag{flex:none;min-width:52px;text-align:center;font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px}
.foot{position:sticky;bottom:-24px;background:var(--color-surface);margin-bottom:-24px;padding-bottom:24px;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding-top:12px}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--color-text);color:#fff;padding:8px 8px 8px 16px;border-radius:8px;display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100vw - 32px);z-index:5}
.toast.bad{background:var(--color-error)}
.toast button{min-height:44px;border:1px solid #fff;background:none;color:#fff;border-radius:6px;padding:0 12px;cursor:pointer;flex:none}
.toast button:focus-visible{outline-color:#fff}
@media (max-width:1100px){aside{flex-basis:310px}.panel{padding:12px}}
@media (max-width:767px){
 header{padding:4px 12px;gap:2px 8px}h1{font-size:16px}header .ttl{flex:1;min-width:0}
 .designs{order:3;flex:1 1 100%;min-width:0;padding:2px}
 .actions{display:contents}.actions .sub{order:4;flex:1 1 0;padding:0 6px;font-size:13px}.actions .pri{order:1}
 .body{flex-direction:column}.tools{display:none}
 main{flex:1 1 0;min-height:0}aside{flex:0 0 34dvh;border-left:0;border-top:1px solid var(--color-line)}
 .views .tab{padding:0 10px}.selinfo{display:none}
 .status{padding:2px 12px;gap:2px 8px;flex-wrap:nowrap}.zoom .btn{padding:0 8px;font-size:13px}.zoom output{min-width:40px}
 .warnchip{margin-left:0;flex:1;min-width:0;padding:0 8px}.warnchip span{display:none}
 .toast{flex-wrap:wrap;width:calc(100vw - 32px);padding:10px 12px}.toast button{flex:1}
 .ctl3d{flex-wrap:nowrap;overflow-x:auto}.ctl3d>*{flex:none!important}.ctl3d>div{flex-wrap:nowrap}
}
@media (max-width:767px) and (max-height:800px){aside{flex-basis:30dvh}header .help{display:none}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="ttl"><h1>포토프랍 PDF 에디터</h1><p class="help" id="sub"></p></div>
<nav class="designs" aria-label="디자인 목록" id="designs"></nav>
<div class="actions"><button class="btn sub" id="load">작업 불러오기</button><button class="btn sub" id="save">작업 저장</button><button class="btn sub" id="check">검증</button><button class="btn pri" id="export">PDF 내보내기</button></div>
</header>
<div class="body">
<nav class="tools" aria-label="도구" id="tools"></nav>
<main>
<div class="viewbar"><div class="views" role="tablist" aria-label="미리보기 종류" id="views"></div>
<ul class="legend" id="legend" hidden><li><span style="background:#fff"></span>흰색 = 화이트</li><li><span style="background:#FFD84D"></span>노랑 = 반투명(제외)</li><li><span style="background:#000"></span>검정 = 투명</li><li><span style="background:#7A8594"></span>회색 = 불투명인데 화이트 없음</li><li><span style="background:#FF2FB3"></span>분홍 = 화이트가 반투명·투명에 겹침</li></ul></div>
<div class="stage" id="stage" role="tabpanel" aria-label="미리보기">
<canvas id="cv" tabindex="0" role="img" aria-label="미리보기"></canvas>
<div class="v3d" id="v3d" hidden></div>
<div class="empty" id="empty"><div><h2>이미지를 올려 주세요</h2><p class="help">여기로 끌어다 놓아도 돼요.<br>PNG · JPG · WebP (투명 PNG 권장)</p><button class="btn" id="emptyAdd">이미지 올리기</button></div></div>
<div class="busy" id="busy" hidden>계산 중…</div>
</div>
<div class="status"><span class="selinfo" id="selinfo"></span>
<span class="zoom"><button class="btn" id="zout">축소</button><output id="zval">100%</output><button class="btn" id="zin">확대</button><button class="btn" id="zfit">화면 맞춤</button></span>
<button class="warnchip" id="warn" hidden></button></div>
</main>
<aside aria-label="속성"><div class="ptabs" role="tablist" aria-label="속성 탭" id="ptabs"></div><div class="panel" id="panel" role="tabpanel"></div></aside>
</div>
</div>
<div class="sr" id="live" aria-live="polite"></div>
<div id="toasts" role="status"></div>
<dialog id="report" aria-labelledby="repT"></dialog>
<input type="file" id="fImg" accept="image/png,image/jpeg,image/webp" multiple hidden><input type="file" id="fJson" accept=".json,application/json" hidden>
<script id="core">/* 아크릴 포토프랍 코어: DOM 없이 동작해요. 나중에 단일 HTML 안에 그대로 넣어요.
 * 좌표는 mm(왼쪽 위 원점, y 아래쪽). 래스터 픽셀 중심 = (i + 0.5 - pad) / ppm. */
(function (root) {
  'use strict';
  const INF = 1e20;

  // ---------- 격자 ----------
  /** padMm: 닫기 연산이 격자 가장자리에서 잘리지 않도록 필요한 추가 여백 */
  function makeGrid(plate, ppm, padMm = 0) {
    const pad = Math.max(4, Math.ceil(padMm * ppm) + 4);
    return {
      ppm, pad,
      w: Math.ceil(plate.w * ppm) + pad * 2,
      h: Math.ceil(plate.h * ppm) + pad * 2,
    };
  }
  function pickPpm(plate, maxPixels, maxPpm) {
    return Math.min(maxPpm, Math.sqrt(maxPixels / (plate.w * plate.h)));
  }
  const toMm = (g, i) => (i + 0.5 - g.pad) / g.ppm;

  // ---------- 거리 변환 (Felzenszwalb) ----------
  /** mask에서 값이 target인 가장 가까운 픽셀까지의 거리(px) */
  function edt(mask, w, h, target = 1) {
    const n = Math.max(w, h);
    const f = new Float64Array(n), d = new Float64Array(n);
    const v = new Int32Array(n), z = new Float64Array(n + 1);
    const sq = new Float64Array(w * h);
    for (let i = 0; i < sq.length; i++) sq[i] = mask[i] === target ? 0 : INF;

    function pass(len) {
      let k = -1;
      for (let q = 0; q < len; q++) {
        if (f[q] >= INF) continue;
        let s = -Infinity;
        while (k >= 0) {
          const p = v[k];
          s = (f[q] + q * q - f[p] - p * p) / (2 * (q - p));
          if (s > z[k]) break;
          k--;
        }
        k++;
        v[k] = q;
        z[k] = k === 0 ? -Infinity : s;
        z[k + 1] = Infinity;
      }
      if (k < 0) { for (let q = 0; q < len; q++) d[q] = INF; return; }
      let j = 0;
      for (let q = 0; q < len; q++) {
        while (z[j + 1] < q) j++;
        const dx = q - v[j];
        d[q] = dx * dx + f[v[j]];
      }
    }
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = sq[y * w + x];
      pass(h);
      for (let y = 0; y < h; y++) sq[y * w + x] = d[y];
    }
    const out = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      const o = y * w;
      for (let x = 0; x < w; x++) f[x] = sq[o + x];
      pass(w);
      for (let x = 0; x < w; x++) out[o + x] = Math.sqrt(d[x]);
    }
    return out;
  }

  // ---------- 모폴로지 / SDF ----------
  function dilate(mask, w, h, r) {
    if (r <= 0) return mask.slice();
    const d = edt(mask, w, h, 1), out = new Uint8Array(mask.length);
    for (let i = 0; i < out.length; i++) out[i] = d[i] <= r + 0.5 ? 1 : 0;
    return out;
  }
  function erode(mask, w, h, r) {
    if (r <= 0) return mask.slice();
    const d = edt(mask, w, h, 0), out = new Uint8Array(mask.length);
    for (let i = 0; i < out.length; i++) out[i] = d[i] > r + 0.5 ? 1 : 0;
    return out;
  }
  const closing = (m, w, h, r) => erode(dilate(m, w, h, r), w, h, r);
  const opening = (m, w, h, r) => dilate(erode(m, w, h, r), w, h, r);
  /** 밖 = 양수, 안 = 음수 (px) */
  function sdf(mask, w, h) {
    const inD = edt(mask, w, h, 0), outD = edt(mask, w, h, 1);
    const out = new Float32Array(mask.length);
    for (let i = 0; i < out.length; i++) out[i] = mask[i] ? -(inD[i] - 0.5) : outD[i] - 0.5;
    return out;
  }

  // ---------- 연결 요소 ----------
  /** 전경(1) 라벨링. 반환: labels(1부터), areas[label] */
  function label(mask, w, h, conn8 = true) {
    const labels = new Int32Array(mask.length), areas = [0];
    const stack = new Int32Array(mask.length);
    for (let s = 0; s < mask.length; s++) {
      if (!mask[s] || labels[s]) continue;
      const id = areas.length;
      let top = 0, area = 0;
      stack[top++] = s; labels[s] = id;
      while (top) {
        const i = stack[--top]; area++;
        const x = i % w, y = (i - x) / w;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if ((!dx && !dy) || (!conn8 && dx && dy)) continue;
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const j = ny * w + nx;
          if (mask[j] && !labels[j]) { labels[j] = id; stack[top++] = j; }
        }
      }
      areas.push(area);
    }
    return { labels, areas };
  }
  /** 지정한 라벨들의 외접 상자(px) */
  function labelBoxes(labels, count, w, ids) {
    const b = Array.from({ length: count }, () => null), want = new Uint8Array(count);
    ids.forEach((i) => { want[i] = 1; });
    for (let i = 0; i < labels.length; i++) {
      const l = labels[i];
      if (!l || !want[l]) continue;
      const x = i % w, y = (i - x) / w, o = b[l];
      if (!o) b[l] = { x0: x, y0: y, x1: x, y1: y };
      else { if (x < o.x0) o.x0 = x; if (x > o.x1) o.x1 = x; if (y > o.y1) o.y1 = y; }
    }
    return ids.map((i) => b[i]);
  }
  const boxMm = (g, b) => ({ x0: toMm(g, b.x0), y0: toMm(g, b.y0), x1: toMm(g, b.x1), y1: toMm(g, b.y1) });
  function fillHoles(mask, w, h) {
    const out = new Uint8Array(mask.length).fill(1);
    const stack = new Int32Array(mask.length);
    let top = 0;
    const visit = (i) => { if (!mask[i] && out[i]) { out[i] = 0; stack[top++] = i; } };
    for (let x = 0; x < w; x++) { visit(x); visit((h - 1) * w + x); }

  // ---------- Marching squares ----------
  /** field > 0 이 안쪽. 닫힌 루프(픽셀 중심 좌표) 배열을 돌려줘요. */
  function marchingSquares(field, w, h) {

      const seg = (s, e) => { next[s] = e; starts.push(s); };
      const joined = () => a + b + c + d > 0;
      switch (code) { // 진행 방향의 왼쪽이 안쪽
        case 8: seg(L, T); break;
        case 4: seg(T, R); break;
        case 2: seg(R, B); break;
        case 1: seg(B, L); break;
        case 12: seg(L, R); break;
        case 6: seg(T, B); break;
        case 3: seg(R, L); break;
        case 9: seg(B, T); break;
        case 7: seg(T, L); break;
        case 11: seg(R, T); break;
        case 13: seg(B, R); break;
        case 14: seg(L, B); break;
        case 10: if (joined()) { seg(R, T); seg(L, B); } else { seg(L, T); seg(R, B); } break;

  // ---------- Douglas–Peucker (닫힌 루프) ----------

  const LIMIT = 9.5 * 1024 * 1024;
  let working = false, pdfOut = null;
  const fsize = (n) => (n < 104858 ? Math.ceil(n / 1024) + 'KB' : (n / 1048576).toFixed(1) + 'MB');
  const toBlob = (c, t, q) => new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('이미지를 변환하지 못했어요'))), t, q));
  async function makePdf(designs) {
    const used = new Set(designs.flatMap((d) => d.images.map((i) => i.asset)));
    let scale = 1, bytes, tries = 0;
    for (;;) {
      const jpegs = {};
      for (const id of used) {
        const a = assets.get(id);
        if (!a.opaque) continue;
        let c = a.full;
        if (scale < 1) { c = h('canvas', { width: Math.max(1, Math.round(a.w * scale)), height: Math.max(1, Math.round(a.h * scale)) }); const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(a.full, 0, 0, c.width, c.height); }
        jpegs[id] = { w: c.width, h: c.height, bytes: new Uint8Array(await (await toBlob(c, 'image/jpeg', 0.95)).arrayBuffer()) };
      }
      bytes = (await call('pdf', { layers: layerNames(), jpegs, scale })).bytes;
      if (bytes.byteLength <= LIMIT || tries >= 3) break;
      tries++; scale *= Math.sqrt(LIMIT / bytes.byteLength) * 0.97;
    }
    return { bytes, scale };
  }
  async function run(force) {
    if (working) return;
    if (typeof CompressionStream === 'undefined') { toast('✕ 이 브라우저는 PDF 압축을 지원하지 않아요. 최신 Chrome, Edge, Safari, Firefox를 사용해 주세요.', true); return; }
    const designs = P.designs.filter((d) => d.images.length);
    if (!designs.length) return;
    working = true;
    const b = $(force ? 'check' : 'export'); b.setAttribute('aria-busy', 'true'); $('check').disabled = $('export').disabled = true;
    say('PDF를 만드는 중이에요');
    try {
      const snap = clone(designs);
      const { reports } = await call('compute', { designs: snap, plate: clone(P.plate) });
      const { bytes, scale } = await makePdf(snap);
      pdfOut = { bytes, name: `포토프랍_${P.plate.w}x${P.plate.h}.pdf` };
      const rows = buildRows(reports, designs, bytes.byteLength, scale);
      if (!force && rows.every((r) => r.s === 'ok')) savePdf(); else showReport(rows);
    } catch (e) { toast('✕ PDF를 만들지 못했어요: ' + e.message, true, () => run(force)); }
    working = false; b.removeAttribute('aria-busy');
    const any = P.designs.some((d) => d.images.length); $('check').disabled = $('export').disabled = !any;
  }
  function savePdf() {
    download(new Blob([pdfOut.bytes], { type: 'application/pdf' }), pdfOut.name);
    toast(`✓ PDF를 저장했어요 (${fsize(pdfOut.bytes.byteLength)})`);
  }
  function buildRows(reports, designs, len, scale) {
    const rows = [], many = P.designs.length > 1;
    reports.forEach((r, k) => {
      const d = designs[k], idx = P.designs.indexOf(d), pre = many ? `디자인 ${idx + 1}: ` : '';
      const add = (s, t, sub, boxes, view) => rows.push({ s, t: pre + t, sub, boxes, view, idx });
      if (r.cutCount === 1) add('ok', '칼선이 닫힌 외곽선 1개예요', d.cut.stick.on ? '막대와 몸체가 하나로 합쳐졌어요' : '막대 없음');
      else add('err', `칼선 외곽선이 ${r.cutCount}개예요(1개여야 해요)`, '이미지 크기나 칼선 여유를 늘려 주세요.');
      if (r.removed) add('warn', `칼선에서 떨어진 조각 ${r.removed}개를 뺐어요`, '칼선 이음 반경이나 여유를 늘려 보세요.', r.removedBoxes, 'final');
      if (r.cutOutPlate) add('err', '칼선이 판 밖으로 나갔어요', '이미지를 안쪽으로 옮기거나 크기·여유를 줄여 주세요.');
      else if (r.cutOutSafe) add('warn', `칼선이 안전 여백 ${P.plate.safeMargin}mm 밖이에요`, '잘릴 때 어긋날 수 있어요.');
      if (r.imagesOut.length) add('warn', `안전 여백 밖으로 나간 이미지: ${r.imagesOut.join(', ')}`, '이미지를 안쪽으로 옮기거나 크기를 줄여 주세요.');
      else if (!r.cutOutPlate && !r.cutOutSafe) add('ok', `판 크기 ${P.plate.w}×${P.plate.h} mm, 1:1 실제 크기`, `이미지와 칼선이 안전 여백 ${P.plate.safeMargin}mm 안쪽에 있어요`);
      if (!r.hasWhite) add('warn', '화이트가 없어요', d.white.mode === 'none' ? '화이트 방식이 "없음"이에요.' : '불투명한 부분이 없어요. 불투명 기준을 낮춰 보세요.');
      else {
        if (r.overlap) add('warn', `화이트가 반투명·투명 부분에 겹친 픽셀 ${r.overlap.toLocaleString()}개`, d.white.mode === 'full' ? '전체 채움이라 의도한 결과면 괜찮아요.' : '화이트 크기를 줄이거나 추가로 칠한 곳을 확인해 주세요.', r.overBoxes, 'check');
        else add('ok', '화이트가 반투명·투명 부분에 겹친 픽셀 0개');
        if (d.white.mode === 'auto') add(r.gap >= 0 ? 'ok' : 'warn', `불투명 경계에서 화이트까지 최소 간격 ${r.gap.toFixed(2)} mm`, r.gap < 0 ? '화이트가 불투명 경계를 넘었어요.' : null);
        if (r.thinCount) add('warn', `0.3mm 미만으로 가는 화이트 ${r.thinCount}곳`, '인쇄가 안 될 수 있어요. 해당 부분을 보호 영역으로 지정하거나 줄이기를 낮춰 보세요.', r.thinBoxes, 'white');
        else add('ok', '0.3mm 미만으로 가는 화이트가 없어요');
      }
      const low = d.images.filter((im) => dpi(im) * scale < 150);
      if (low.length) add('warn', `해상도 150dpi 미만: ${low.map((i) => `${i.name}(${Math.round(dpi(i) * scale)}dpi)`).join(', ')}`, '흐리게 인쇄될 수 있어요.');
    });
    const mb = fsize(len);
    if (len > 10 * 1048576) rows.push({ s: 'err', t: `파일 용량 ${mb} (한도 10 MB 초과)`, sub: '이미지 수나 해상도를 줄여 주세요.' });
    else if (scale < 1) rows.push({ s: 'warn', t: `파일 용량 ${mb} (한도 10 MB)`, sub: `용량을 맞추려고 이미지 해상도를 ${Math.round(scale * 100)}%로 낮췄어요.` });
    else rows.push({ s: 'ok', t: `파일 용량 ${mb} (한도 10 MB)`, sub: '이미지는 원본 해상도 그대로 들어가요' });
    return rows;
  }
  function showReport(rows) {
    const dlg = $('report'), nE = rows.filter((r) => r.s === 'err').length, nW = rows.filter((r) => r.s === 'warn').length;
    const L = P.layers, imgs = P.designs.flatMap((d) => d.images), ln = layerNames();
    const names = C.uniqueNames([{ name: L.white, fallback: '화이트' }, ...(L.imageMode === 'merged' ? [{ name: L.mergedName, fallback: '이미지' }] : imgs.map((im) => ({ name: ln.imageNames[im.id], fallback: '이미지' }))), { name: L.cut, fallback: '칼선' }]);
    const empty = P.designs.filter((d) => !d.images.length).length;
    const T = { ok: '통과', warn: '경고', err: '오류' };
    dlg.replaceChildren(h('h2', { id: 'repT' }, '내보내기 전 검증'),
      h('p', { class: 'help' }, `${P.plate.w}×${P.plate.h} mm · ${P.designs.length - empty}페이지 · 레이어 ${names.length}개(${names.join(' / ')})${empty ? ` · 빈 디자인 ${empty}개는 빠져요` : ''}`),
      h('div', { class: 'banner ' + (nE ? 'err' : nW ? 'warn' : 'ok') }, h('b', {}, nE ? `오류 ${nE}개` : nW ? `경고 ${nW}개` : '모두 통과'), nE ? '고쳐야 저장할 수 있어요.' : nW ? '저장은 할 수 있지만 확인을 권해요.' : '바로 저장해도 좋아요.'),
      h('ul', { class: 'rep' }, rows.map((r) => h('li', {}, h('span', { class: 'tag ' + r.s }, T[r.s]), h('div', {}, h('p', {}, r.t, r.sub ? h('small', {}, r.sub) : null),
        r.boxes && r.boxes.length ? h('button', { class: 'btn', onclick: () => locate(r) }, '문제 위치 보기') : null)))),
      h('div', { class: 'foot' }, h('button', { class: 'btn', onclick: () => dlg.close() }, '닫기'), h('button', { class: 'btn pri', disabled: nE > 0, onclick: () => { dlg.close(); savePdf(); } }, 'PDF 저장')));
    if (!dlg.open) dlg.showModal();
    say(nE ? `오류 ${nE}개` : nW ? `경고 ${nW}개` : '검증을 모두 통과했어요');
  }
  function locate(r) {
    $('report').close();
    if (ui.d !== r.idx) { ui.d = r.idx; ui.sel.clear(); refresh(); }
    ui.markers = r.boxes; setView(r.view);
    const b = r.boxes[0], z = clamp(Math.min(W, H) / 4 / Math.max(b.x1 - b.x0, b.y1 - b.y0, 2), fitZoom, 60);
    ui.zoom = z; ui.panX = W / 2 - (b.x0 + b.x1) / 2 * z; ui.panY = H / 2 - (b.y0 + b.y1) / 2 * z; ui.manual = true;
    cv.focus(); draw(); say(`문제 위치 ${r.boxes.length}곳을 표시했어요`);
  }

  // ---------- 연결 ----------
  $('fImg').addEventListener('change', (e) => { const f = [...e.target.files]; e.target.value = ''; addFiles(f); });
  $('fJson').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) loadJson(f); });
  $('emptyAdd').onclick = () => $('fImg').click();
  $('load').onclick = () => $('fJson').click();
  $('save').onclick = saveJson;
  $('check').onclick = () => run(true);
  $('export').onclick = () => run(false);
  $('warn').onclick = () => run(true);
  $('zin').onclick = () => zoomAt(1.25); $('zout').onclick = () => zoomAt(0.8);
  $('zfit').onclick = () => { ui.zoom = 0; ui.manual = false; draw(); };
  let depth = 0;
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  addEventListener('dragenter', (e) => { if (hasFiles(e)) { depth++; $('stage').classList.add('drop'); } });
  addEventListener('dragleave', (e) => { if (hasFiles(e) && --depth <= 0) { depth = 0; $('stage').classList.remove('drop'); } });
  addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener('drop', (e) => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; $('stage').classList.remove('drop'); addFiles(e.dataTransfer.files); });
  addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });

  startWorker();
  setView('final');
  refresh();
})();
</script>
</body>
</html>
